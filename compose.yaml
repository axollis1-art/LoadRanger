services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: loadranger
      POSTGRES_USER: loadranger
      POSTGRES_PASSWORD: loadranger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadranger -d loadranger"]
      interval: 2s
      timeout: 5s
      retries: 10
