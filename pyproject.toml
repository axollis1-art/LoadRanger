[project]
name = "loadranger"
version = "0.1.0"
description = "Deterministic commercial-credit underwriting and covenant monitoring"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.19,<2",
    "pre-commit>=4.5,<5",
    "pytest>=8.4,<9",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src"]
python_version = "3.13"
strict = true
